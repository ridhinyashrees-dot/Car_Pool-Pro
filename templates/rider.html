<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Pool - Rider Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Add this styling for the rider map container */
    #rider-map { 
        width: 100%; 
        height: 250px; 
        border-radius: 16px; 
        margin-top: 15px; 
        border: 2px solid #edf2f7; 
    }
  </style>
    <style>
        :root {
            --primary: #2ecc71;   /* Eco-green */
            --secondary: #3498db; /* Trust blue */
            --dark: #2c3e50;      /* Professional dark */
            --light: #ecf0f1;     /* Clean background */
            --white: #ffffff;
            --gradient-primary: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --gradient-secondary: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            --shadow-light: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-hover: 0 20px 40px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, #e8f5e8 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(20px);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-light);
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .hidden { display: none !important; }

        /* --- HEADERS --- */
        h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        /* --- FORMS --- */
        .input-group { margin-bottom: 1.8rem; }

        label { 
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.8rem; 
            font-weight: 600; 
        }

        input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border: 2px solid #e8f0fe;
            border-radius: 16px;
            font-size: 1rem;
            background: #fafbff;
        }

        .location-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-gps-detect {
            position: absolute;
            right: 12px;
            background: var(--gradient-secondary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- BUTTONS --- */
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            width: 100%;
            padding: 1.3rem;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-secondary {
            background: transparent;
            color: var(--dark);
            border: 2px solid #e1e8ed;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .btn-track {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }

        .btn-book {
            background: var(--gradient-primary);
            color: white;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.8rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        /* --- CONTACT ACTIONS --- */
        .contact-actions {
            display: flex;
            gap: 12px;
            margin-top: 1.5rem;
        }

        .btn-call, .btn-whatsapp {
            color: white;
            flex: 1;
            text-decoration: none;
            text-align: center;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-call { background: #3498db; }
        .btn-whatsapp { background: #25D366; }
        
        .sos-floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            background-color: #ff4757;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
            cursor: pointer;
            z-index: 9999;
            border: 3px solid white;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        .match-item {
            border-left: 5px solid var(--primary);
            background: #f9f9f9;
            padding: 1.5rem;
            margin-top: 1.5rem;
            border-radius: 20px;
        }

        .match-item strong { display: block; font-size: 1.2rem; margin-bottom: 5px; }
        .match-item span { display: block; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <h1><i class="fas fa-car-side"></i> Campus Pool</h1>
    </nav>

    <main class="container">
        <section id="form-section" class="card">
            <h2><i class="fas fa-search"></i> Find Nearby Rides</h2>
            
            <div class="input-group">
                <label><i class="fas fa-user"></i> Your Name</label>
                <input type="text" id="userName" placeholder="Enter your name">
            </div>
            
            <div class="sos-floating-btn" onclick="handleSOS()">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            
            <div class="input-group">
                <label><i class="fas fa-map-marker-alt"></i> Pickup Location</label>
                <div class="location-wrapper">
                    <input type="text" id="pickup" placeholder="Detecting your location...">
                    <button type="button" onclick="autoDetectLocation()" class="btn-gps-detect">
                        <i class="fas fa-gps"></i> Auto-Detect
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-flag-checkered"></i> Destination</label>
                <select id="destination" style="width: 100%; padding: 1.2rem 1.5rem; border: 2px solid #e8f0fe; border-radius: 16px; font-size: 1rem; background: #fafbff; appearance: none;">
                    <option value="" disabled selected>Where are you heading?</option>
                    <option value="Sri Eshwar College of Engineering">Sri Eshwar College of Engineering</option>
                    <option value="Nehru College of Engineering">Nehru College of Engineering</option>
                    <option value="V.S.B College of Engineering">V.S.B College of Engineering</option>
                    <option value="MCT College of Engineering">MCT College of Engineering</option>
                    <option value="Karpagam College of Engineering">Karpagam College of Engineering</option>
                    <option value="PSG College of Engineering">PSG College of Engineering</option>
                    <option value="CIT college of Engineering">CIT college of Engineering</option>
                </select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-clock"></i> Preferred Time</label>
                <input type="time" id="travelTime">
            </div>

            <button onclick="findMatches()" class="btn-primary">
                <i class="fas fa-rocket"></i> Scan Nearby Drivers
            </button>
        </section>

        <section id="results-section" class="card hidden">
            <button onclick="goBack()" class="btn-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <h2><i class="fas fa-users"></i> Available Drivers Nearby</h2>
            <div id="matchList"></div>
        </section>

        <section id="map-section" class="card hidden">
            <button onclick="hideMap()" class="btn-secondary">
                <i class="fas fa-times"></i> Stop Tracking
            </button>
            <h2><i class="fas fa-map-marked-alt"></i> Real-Time Tracking</h2>
            <p id="status-text" style="text-align: center; color: #e67e22; font-weight: bold; margin-bottom: 12px;">Connecting to driver's GPS coordinates...</p>
            <div id="map" style="width: 100%; height: 380px; border-radius: 20px; box-shadow: var(--shadow-light);"></div>
        </section>
    </main>

    <script>
    const socket = io();
    let map;
    let driverMarker, riderMarker;
    let trackingPhone = "";
    
    // Global tracking variables for the current rider's position
    let currentRiderLat = null;
    let currentRiderLng = null;

    let activeRideId = ""; // Track current ride ID for cancellation lookup
    let activeRiderPhone = ""; // Track current rider phone reference

    // Run automatically when the dashboard opens
    window.onload = function() {
        autoDetectLocation();
    };

    // 1️⃣ AUTOMATIC GPS LOCATION DETECTOR
    function autoDetectLocation() {
        const pickupInput = document.getElementById('pickup');
        pickupInput.placeholder = "Locating your GPS coordinates...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    currentRiderLat = position.coords.latitude;
                    currentRiderLng = position.coords.longitude;

                    // Convert raw GPS numbers into a readable city/town name using OpenStreetMap free API
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentRiderLat}&lon=${currentRiderLng}`);
                        const data = await response.json();
                        // Extract neighborhood, suburb, town, or city text
                        const placeName = data.address.suburb || data.address.town || data.address.village || data.address.city || "My Location";
                        pickupInput.value = placeName;
                    } catch (err) {
                        pickupInput.value = `${currentRiderLat.toFixed(4)}, ${currentRiderLng.toFixed(4)}`;
                    }
                },
                (error) => {
                    console.error("GPS Error: ", error);
                    pickupInput.placeholder = "Location access denied. Please type manually.";
                    pickupInput.value = "Pollachi"; // Fallback default
                    currentRiderLat = 10.6593; // Fallback Pollachi coordinates
                    currentRiderLng = 77.0097;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            pickupInput.placeholder = "Geolocation not supported by browser.";
        }
    }

    async function findMatches() {
    const name = document.getElementById('userName').value || "Guest";
    const pickup = document.getElementById('pickup').value;
    const dest = document.getElementById('destination').value;
    const time = document.getElementById('travelTime').value;

    if (!pickup) {
        alert("Please wait for your location to auto-detect or type it manually!");
        return;
    }

    try {
        const response = await fetch('/api/match', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                name: name, 
                pickup: pickup, 
                destination: dest, 
                time: time,
                // 🔥 PASSING THE LIVE GPS NUMBERS HERE
                lat: currentRiderLat,
                lng: currentRiderLng
            })
        });

        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.message || "HTTP error " + response.status);
        }

        const matches = await response.json();
        displayResults(matches, name);
    } catch (e) {
        console.error(e);
        alert("❌ Search Failed: " + e.message);
    }
}

    function displayResults(matches, riderName) {
        document.getElementById('form-section').classList.add('hidden');
        document.getElementById('results-section').classList.remove('hidden');
        
        const list = document.getElementById('matchList');
        list.innerHTML = "";

        if (!matches || matches.length === 0) {
            list.innerHTML = `<p style="text-align:center; padding: 2rem; color: #7f8c8d;">No active drivers are available near your location right now.</p>`;
            return;
        }

        matches.forEach(m => {
            const driverId = m.id || "";
            const driverName = m.name || "Driver";
            const pLoc = m.pickup || "Pickup Location";
            const dLoc = m.dest || "Destination";
            const dTime = m.time || "--:--";
            const dSeats = m.seats || "0";
            const dCharge = m.charge || "0";
            const dPhone = m.phone || "";

            const waMsg = encodeURIComponent(`Hello ${driverName}, I am ${riderName}. I see you are near ${pLoc} heading to ${dLoc}. I'd like to book a ride with you!`);
            
            list.innerHTML += `
                <div class="match-item">
                    <strong><i class="fas fa-user-circle"></i> ${driverName}</strong>
                    <span><i class="fas fa-map-marker-alt"></i> Location: ${pLoc}</span>
                    <span><i class="fas fa-flag-checkered"></i> Destination: ${dLoc}</span>
                    <span><i class="fas fa-clock"></i> Leaves at: ${dTime}</span>
                    <span><i class="fas fa-couch"></i> ${dSeats} Seats Left | Price: ₹${dCharge}</span>
                    
                    <div class="contact-actions">
                        <a href="tel:${dPhone}" class="btn-call">
                            <i class="fas fa-phone"></i> Call
                        </a>
                        <a href="https://wa.me/${dPhone}?text=${waMsg}" target="_blank" class="btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> WhatsApp
                        </a>
                    </div>

                    <button onclick="bookDriverSeat('${driverId}')" class="btn-book">
                        <i class="fas fa-ticket-alt"></i> Book Seat (${dSeats} left)
                    </button>

                    <button onclick="startTracking('${dPhone}')" class="btn-track">
                        <i class="fas fa-location-arrow"></i> Track Live Ride
                    </button>
                </div>`;
        });
    }

    // 🔥 LIVE SEAT SECURING PROMPT CONTROLLER
    // 🔥 LIVE SEAT SECURING PROMPT CONTROLLER (UPDATED TO AUTO-LAUNCH TRACKING)
    async function bookDriverSeat(driverId) {
        if (!driverId) {
            alert("Configuration Error: Invalid driver reference identifier mapped.");
            return;
        }

        const riderName = prompt("Enter your full name to confirm seat booking:");
        if (!riderName) return; 
        
        const riderPhone = prompt("Enter your WhatsApp phone number (e.g., +919876543210):");
        if (!riderPhone) return alert("Booking cancelled. Phone tracking references are required.");

        try {
            const response = await fetch('/api/book_seat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ride_id: driverId,
                    riderName: riderName,
                    riderPhone: riderPhone
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert(`🎉 Seat Booked Successfully! Moving you to live tracking now.`);
                
                // Keep references handy in case they hit the cancel button
                activeRideId = driverId;
                activeRiderPhone = riderPhone;

                // 🎯 AUTO-SWITCH REDIRECTION: Jump straight to map screen panel view
                if (result.driver_phone) {
                    startTracking(result.driver_phone);
                } else {
                    findMatches();
                }
            } else {
                alert("❌ Booking Denied: " + (result.message || "Unknown assignment mismatch"));
            }
        } catch (error) {
            alert("System Communication Failure: " + error.message);
        }
    }
    

    // 2️⃣ INITIALIZE MAP WITH DUAL MARKERS (YOU AND DRIVER)
    function startTracking(phoneNum) {
        trackingPhone = phoneNum;
        
        document.getElementById('results-section').classList.add('hidden');
        document.getElementById('map-section').classList.remove('hidden');
        
        document.getElementById('status-text').innerText = "Waiting for driver GPS stream...";
        document.getElementById('status-text').style.color = "#e67e22";

        // Create map if it does not exist
        if (!map) {
            map = L.map('map').setView([10.65, 77.01], 11); 
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        // Drop a permanent marker for the Rider (Blue color pin default)
        if (currentRiderLat && currentRiderLng) {
            if (riderMarker) map.removeLayer(riderMarker);
            
            riderMarker = L.marker([currentRiderLat, currentRiderLng]).addTo(map)
                .bindPopup(`<b>You (Rider Position)</b>`).openPopup();
                
            map.setView([currentRiderLat, currentRiderLng], 12);
        }
    }

    // 3️⃣ INTERCEPT WEBSOCKET LOCATION STREAMS
    // 3️⃣ INTERCEPT WEBSOCKET LOCATION STREAMS
    socket.on('location_broadcast', (data) => {
        // Log to browser console (F12) so you can see exactly what data is arriving!
        console.log("Incoming driver telemetry stream:", data);

        // 🎯 FIX: Ensure phone numbers match clean by removing any spaces/pluses, or bypass if testing
        if (!trackingPhone || data.driver_phone.includes(trackingPhone.replace('+', '')) || trackingPhone.includes(data.driver_phone.replace('+', ''))) {
            
            if (data.reached_destination === true) {
                document.getElementById('status-text').innerText = "🏁 Driver has reached the destination! Tracking closed.";
                document.getElementById('status-text').style.color = "#2ecc71";
                if (driverMarker) {
                    map.removeLayer(driverMarker);
                    driverMarker = null;
                }
                return;
            }

            const driverPos = [data.lat, data.lng];
            document.getElementById('status-text').innerText = "⚡ Connected: Rendering Live Routes";
            document.getElementById('status-text').style.color = "#2ecc71";

            // Update or drop the Driver pin on the map
            if (!driverMarker) {
                // FALLBACK: Use Leaflet's built-in default marker if the custom asset string breaks
                driverMarker = L.marker(driverPos).addTo(map)
                    .bindPopup(`<b>🚗 Driver (${data.driver_name || 'In-Route'})</b>`).openPopup();
            } else {
                driverMarker.setLatLng(driverPos);
            }

            // 🎯 THE DUAL TRACKING MAGIC: If both markers exist, perfectly frame them together!
            if (riderMarker && driverMarker) {
                const group = new L.featureGroup([riderMarker, driverMarker]);
                map.fitBounds(group.getBounds().pad(0.20)); // Automatically zooms map perfectly to show both pins!
            } else {
                map.setView(driverPos, 14); // Fallback focus on driver
            }
        }
    });
    async function hideMap() {
        const confirmCancel = confirm("Are you sure you want to cancel this ride allocation?\n\nThis will free up your seat and update the driver's manifest roster panel.");
        if (!confirmCancel) return;

        if (activeRideId && activeRiderPhone) {
            try {
                const response = await fetch('/api/cancel_seat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ride_id: activeRideId,
                        riderPhone: activeRiderPhone
                    })
                });

                if (response.ok) {
                    alert("🗑️ Ride cancelled successfully. Seat and earnings counters updated!");
                }
            } catch (err) {
                console.error("Cancellation transmission sync error:", err);
            }
        }

        // Clean UI state parameters and push layout back to the homepage forms view
        document.getElementById('map-section').classList.add('hidden');
        document.getElementById('form-section').classList.remove('hidden');
        
        // Remove driver pin from visual engine safely
        if (driverMarker) {
            map.removeLayer(driverMarker);
            driverMarker = null;
        }
        
        trackingPhone = ""; 
        activeRideId = "";
        activeRiderPhone = "";
    }

    function goBack() {
        document.getElementById('form-section').classList.remove('hidden');
        document.getElementById('results-section').classList.add('hidden');
    }

    function handleSOS() {
        const securityNumber = "100"; 
        const isEmergency = confirm("Action Required: Trigger Emergency SOS?\n\nThis will open your dialer to call Campus Security.");
        if (isEmergency) {
            window.location.href = `tel:${securityNumber}`;
        }
    }
</script>
</body>
</html>
