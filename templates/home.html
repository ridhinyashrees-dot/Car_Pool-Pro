<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Pool - Smart Carpooling</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        * { margin:0; padding:0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, var(--light) 0%, #e8f5e8 100%); min-height: 100vh; }
        
        nav { background: #2c3e50; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: var(--shadow); }
        nav h1 { font-weight: 800; color: var(--primary); cursor: pointer; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { color: white; text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nav-item:hover { color: var(--primary); }
        
        .container { max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; }
        .card { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: var(--shadow); margin-bottom: 2rem; }
        .hidden { display: none !important; }
        
        .mode-selection { display: flex; flex-direction: column; gap: 20px; margin-top: 1rem; }
        .mode-btn { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 2rem; border-radius: 16px; border: none; font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: 0.3s transform, 0.3s box-shadow; text-decoration: none; }
        .mode-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        .btn-driver { background: #34495e; color: white; }
        .btn-rider { background: var(--primary); color: white; }
        
        h2 { margin-bottom: 1.5rem; color: var(--dark); text-align: center; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--dark); }
        input { width: 100%; padding: 1rem; border: 2px solid #edf2f7; border-radius: 12px; font-size: 1rem; }
        
        .btn { width: 100%; padding: 1rem; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #3498db; color: white; }
        .btn-outline { background: transparent; border: 2px solid #cbd5e0; color: var(--dark); }
        
        .stat-badge { background: #f7fafc; padding: 15px; border-radius: 12px; border-left: 5px solid var(--primary); font-size: 1.2rem; font-weight: bold; margin-bottom: 1.5rem; color: var(--dark); }
        .rider-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; font-weight: 600; }
        .wa-btn { color: #25D366; text-decoration: none; font-size: 1.1rem; font-weight: bold; }
        .back-btn { margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 5px; color: var(--dark); font-weight: 600; cursor: pointer; }
        
        /* 🗺️ MAP STYLING */
        #map { width: 100%; height: 250px; border-radius: 16px; margin-top: 10px; border: 2px solid #edf2f7; }
        .btn-tracking-on { background: #e67e22; color: white; }
    </style>
</head>
<body>

    <nav>
        <h1 onclick="showSection('landing-section')"><i class="fas fa-car-side"></i> Campus Pool</h1>
        <div class="nav-links">
            <span class="nav-item" onclick="checkAuthAndLoadDashboard()"><i class="fas fa-id-card-alt"></i> Driver Portal</span>
        </div>
    </nav>

    <main class="container">
        
        <section id="landing-section" class="card">
            <h2>Welcome to Campus Pool</h2>
            <p style="text-align: center; color: #7f8c8d; margin-bottom: 2rem;">Select your route profile to begin carpooling</p>
            <div class="mode-selection">
                <button class="mode-btn btn-driver" onclick="checkAuthAndLoadDashboard()">
                    <i class="fas fa-steering-wheel"></i> Become a Driver
                </button>
                <a href="/rider" class="mode-btn btn-rider">
                    <i class="fas fa-user-friends"></i> Become a Rider
                </a>
            </div>
        </section>
        
        <section id="publish-section" class="card hidden">
            <div class="back-btn" onclick="showSection('landing-section')"><i class="fas fa-arrow-left"></i> Back to Main Menu</div>
            <h2><i class="fas fa-bullhorn"></i> Offer a Campus Ride</h2>
            <form id="driverForm" onsubmit="event.preventDefault(); submitPublishRideForm();">
                <div class="input-group"><label>Driver Name</label><input type="text" id="driverName" required></div>
                <div class="input-group"><label>Pickup Location</label><input type="text" id="location" required></div>
                <div class="input-group">
                    <label><i class="fas fa-flag-checkered"></i> Destination</label>
                    <select id="destination" style="width: 100%; padding: 1.2rem 1.5rem; border: 2px solid #e8f0fe; border-radius: 16px; font-size: 1rem; background: #fafbff; appearance: none;" required>
                        <option value="" disabled selected>Where are you heading?</option>
                        <option value="Sri Eshwar College of Engineering">Sri Eshwar College of Engineering</option>
                        <option value="Nehru College of Engineering">Nehru College of Engineering</option>
                        <option value="V.S.B College of Engineering">V.S.B College of Engineering</option>
                        <option value="MCT College of Engineering">MCT College of Engineering</option>
                        <option value="Karpagam College of Engineering">Karpagam College of Engineering</option>
                        <option value="PSG College of Engineering">PSG College of Engineering</option>
                        <option value="CIT college of Engineering">CIT college of Engineering</option>
                    </select>
                </div>
                <div class="input-group"><label>Available Seats</label><input type="number" id="seats" required></div>
                <div class="input-group"><label>Petrol Charge per Seat (₹)</label><input type="number" id="petrolCharge" required></div>
                <div class="input-group"><label>Departure Time</label><input type="time" id="departureTime" required></div>
                <div class="input-group"><label>WhatsApp Contact Number</label><input type="text" id="driverPhone" required></div>
                <button type="submit" class="btn btn-primary">Publish Ride Route</button>
            </form>
        </section>

        <section id="auth-section" class="card hidden">
            <div class="back-btn" onclick="showSection('landing-section')"><i class="fas fa-arrow-left"></i> Back</div>
            <h2 id="auth-title">Driver Authentication Login</h2>
            
            <div class="input-group"><label>Username Reference ID</label><input type="text" id="auth-user"></div>
            <div class="input-group"><label>Account Password</label><input type="password" id="auth-pass"></div>
            <div class="input-group id-phone-group hidden"><label>Contact Mobile Number (WhatsApp)</label><input type="text" id="auth-phone"></div>
            
            <button onclick="handleAuthSubmit()" class="btn btn-secondary" id="auth-main-btn">Sign In</button>
            <button onclick="toggleAuthMode()" class="btn btn-outline" id="auth-toggle-btn">Create An Account</button>
        </section>

        <section id="dashboard-section" class="card hidden">
            <h2><i class="fas fa-gauge-high"></i> Driver Central Control</h2>
            
            <div id="earning-badge" class="stat-badge">💰 Total Projected Earnings: ₹0</div>
            
            <div style="margin-bottom: 20px;">
                <h3 style="color: var(--dark); margin-bottom: 5px;"><i class="fas fa-map-location-dot"></i> Live GPS Telemetry</h3>
                <button id="track-btn" onclick="toggleLocationTracking()" class="btn btn-secondary">
                    <i class="fas fa-location-arrow"></i> Start Live Location Sharing
                </button>
                <div id="map"></div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <h3 style="color: var(--dark); margin-bottom: 10px;"><i class="fas fa-users"></i> Booked Passengers Manifest</h3>
                <div id="manifest-list" style="background: #fafbff; border-radius: 12px; padding: 10px; border: 1px solid #e2e8f0;">
                </div>
            </div>

            <button onclick="logoutDriver()" class="btn btn-outline" style="border-color: #e53e3e; color: #e53e3e;">
                <i class="fas fa-sign-out-alt"></i> Secure Log Out
            </button>
        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socketio/4.7.2/socketio.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    let isSignUpMode = false;
    let isDriverLoggedIn = false;

    var myLeafletMapInstance = null; 
    var driverMarker = null;         
    var watchId = null;
    var isTracking = false;

    const socket = io({
    transports: ['polling', 'websocket']
});

    function showSection(id) {
        document.getElementById('landing-section').classList.add('hidden');
        document.getElementById('publish-section').classList.add('hidden');
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
        
        document.getElementById(id).classList.remove('hidden');
        
        if (id === 'dashboard-section' && myLeafletMapInstance) {
            setTimeout(() => myLeafletMapInstance.invalidateSize(), 200);
        }
    }

    function checkAuthAndLoadDashboard() {
        if (isDriverLoggedIn) {
            showSection('publish-section'); // Redirect directly to ride route offering setup page
        } else {
            showSection('auth-section');
        }
    }

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        const title = document.getElementById('auth-title');
        const mainBtn = document.getElementById('auth-main-btn');
        const toggleBtn = document.getElementById('auth-toggle-btn');
        const phoneGroup = document.querySelector('.id-phone-group');

        if (isSignUpMode) {
            title.innerText = "Register Driver Account";
            mainBtn.innerText = "Sign Up & Register";
            toggleBtn.innerText = "Already have an account? Login";
            phoneGroup.classList.remove('hidden');
        } else {
            title.innerText = "Driver Authentication Login";
            mainBtn.innerText = "Sign In";
            toggleBtn.innerText = "Create An Account";
            phoneGroup.classList.add('hidden');
        }
    }

    async function handleAuthSubmit() {
        const username = document.getElementById('auth-user').value;
        const password = document.getElementById('auth-pass').value;
        const phone = document.getElementById('auth-phone').value;

        const endpoint = isSignUpMode ? '/api/driver/signup' : '/api/driver/login';
        const payload = isSignUpMode ? { username, password, phone } : { username, password };

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                alert(data.message);
                if (!isSignUpMode) {
                    isDriverLoggedIn = true;
                    // 🎯 FIXED: Send them directly to publish their route now that login is successful
                    showSection('publish-section'); 
                } else {
                    toggleAuthMode();
                }
            } else {
                alert("❌ Authentication Denied: " + data.message);
            }
        } catch (err) {
            alert("Network communication failure: " + err.message);
        }
    }

    async function loadDriverDashboardData() {
        try {
            const res = await fetch('/api/driver/dashboard_data');
            if (!res.ok) throw new Error("Session expired.");

            const data = await res.json();
            initMap();

            document.getElementById('earning-badge').innerText = `💰 Total Projected Earnings: ₹${data.total_earnings}`;

            const listContainer = document.getElementById('manifest-list');
            if (!data.has_active_ride) {
                listContainer.innerHTML = `<p style="color:#718096; text-align:center; padding:10px;">You have no active ride offerings published right now.</p>`;
                return;
            }

            if (data.riders.length === 0) {
                listContainer.innerHTML = `<p style="color:#718096; text-align:center; padding:10px;">No passengers have reserved spaces yet (${data.seats_left} seats left).</p>`;
                return;
            }

            listContainer.innerHTML = data.riders.map(r => `
                <div class="rider-row">
                    <span><i class="fas fa-user-circle" style="color:#4a5568;"></i> ${r.name}</span>
                    <a href="https://wa.me/${r.phone}" target="_blank" class="wa-btn">
                        <i class="fab fa-whatsapp"></i> Chat
                    </a>
                </div>
            `).join('');

        } catch (err) {
            isDriverLoggedIn = false;
            showSection('auth-section');
        }
    }

    function initMap() {
        try {
            if (window.myLeafletMapInstance) {
                window.myLeafletMapInstance.remove();
                window.myLeafletMapInstance = null;
            }
            
            const mapContainer = document.getElementById('map');
            if (!mapContainer) return;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const myLat = position.coords.latitude;
                    const myLng = position.coords.longitude;

                    window.myLeafletMapInstance = L.map('map').setView([myLat, myLng], 15); 
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        timeout: 4000 
                    }).addTo(window.myLeafletMapInstance);
                    
                    window.driverMarker = L.marker([myLat, myLng]).addTo(window.myLeafletMapInstance)
                        .bindPopup('Your True Current Location').openPopup();
                }, 
                (error) => {
                    console.warn("GPS fallback used due to timeout. Using default campus view.");
                    createFallbackMap(10.787, 79.138);
                });
            } else {
                createFallbackMap(10.787, 79.138);
            }
            
        } catch (error) {
            console.error("Map layer initialization bypass:", error);
        }
    }

    function createFallbackMap(lat, lng) {
        window.myLeafletMapInstance = L.map('map').setView([lat, lng], 14); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(window.myLeafletMapInstance);
        window.driverMarker = L.marker([lat, lng]).addTo(window.myLeafletMapInstance).bindPopup('Default Location');
    }

    function toggleLocationTracking() {
        const trackBtn = document.getElementById('track-btn');
        
        if (isTracking) {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            isTracking = false;
            trackBtn.innerHTML = `<i class="fas fa-location-arrow"></i> Start Live Location Sharing`;
            trackBtn.className = "btn btn-secondary";
            alert("Location sharing stopped.");
        } else {
            if (!navigator.geolocation) {
                alert("Your browser does not support GPS Geolocation utilities.");
                return;
            }
            
            isTracking = true;
            trackBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Broadcasting Live Location...`;
            trackBtn.className = "btn btn-tracking-on";

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    const newLatLng = new L.LatLng(lat, lng);
                    if (driverMarker) driverMarker.setLatLng(newLatLng);
                    if (myLeafletMapInstance) myLeafletMapInstance.panTo(newLatLng);

                    socket.emit('update_location', {
                        lat: lat,
                        lng: lng,
                        driver_name: document.getElementById('driverName').value || "Driver"
                    });
                },
                (error) => {
                    console.error("GPS Signal Timeout Error:", error);
                },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }
    }

    async function logoutDriver() {
        if (isTracking && watchId) {
            navigator.geolocation.clearWatch(watchId);
        }
        await fetch('/api/driver/logout');
        isDriverLoggedIn = false;
        isTracking = false;
        alert("Logged out successfully!");
        showSection('landing-section');
    }

    async function submitPublishRideForm() {
        console.log("Publish button clicked manually. Extracting data fields...");

        const destinationElement = document.getElementById('destination');
        const selectedDestination = destinationElement ? destinationElement.value : "";

        const rideData = {
            driverName: document.getElementById('driverName').value.trim(),
            location: document.getElementById('location').value.trim(),
            destination: selectedDestination,
            seats: parseInt(document.getElementById('seats').value) || 0,
            petrolCharge: document.getElementById('petrolCharge').value.trim(),
            departureTime: document.getElementById('departureTime').value,
            driverPhone: document.getElementById('driverPhone').value.trim()
        };

        if (!rideData.driverName || !rideData.location || !rideData.destination || !rideData.seats || !rideData.driverPhone) {
            alert("⚠️ Form Validation Failed: Please ensure all input fields are filled out properly!");
            return;
        }

        try {
            console.log("Data packet validated. Routing payload to backend API...", rideData);
            
            const response = await fetch('/api/add_ride', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(rideData)
            });

            if (response.ok) {
                alert('🚗 Ride Successfully Published! Your route is now live for campus riders.');
                document.getElementById('driverForm').reset();

                // 🎯 FIXED: Direct driver to the central live-tracking telemetry dashboard view after publishing route
                showSection('dashboard-section');
                loadDriverDashboardData();
            } else {
                const err = await response.json();
                alert('❌ API Rejection: ' + (err.message || 'Data sync error'));
            }
        } catch (error) {
            console.error("Fetch pipeline crashed:", error);
            alert('❌ Network Failure: ' + error.message);
        }
    }
    </script>
</body>
</html>
